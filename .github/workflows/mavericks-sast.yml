name: Mavericks Security SAST

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  mavericks-scan:
    name: Run SAST & Upload Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect Language
        id: detect
        shell: bash
        run: |
          echo "Detecting primary language..."
          if [ -f "requirements.txt" ] || [ -f "setup.py" ] || [ -f "pyproject.toml" ]; then
            echo "lang=python" >> "$GITHUB_OUTPUT"
          elif [ -f "pom.xml" ] || [ -f "build.gradle" ]; then
            echo "lang=java" >> "$GITHUB_OUTPUT"
          elif [ -f "package.json" ]; then
            echo "lang=javascript" >> "$GITHUB_OUTPUT"
          else
            echo "lang=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Install SAST Tools
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install semgrep
          if [ "${{ steps.detect.outputs.lang }}" = "python" ]; then
            pip install bandit
          fi

      - name: Run Semgrep
        shell: bash
        run: |
          semgrep scan --config auto --config p/owasp-top-ten --config p/cwe-top-25 --config p/security-audit --sarif --output semgrep.sarif || true

      - name: Run Bandit (Python Only)
        if: steps.detect.outputs.lang == 'python'
        shell: bash
        run: |
          bandit -r . -f sarif -o bandit.sarif || true

      - name: Upload SARIF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mavericks-sarif-results
          path: |
            *.sarif
          retention-days: 1
