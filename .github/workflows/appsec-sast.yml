name: AppSec SAST Scanner

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sast-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history for dataflow context
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Scanners
        run: |
          pip install semgrep bandit

      - name: Run Semgrep (Comprehensive Security Rulesets)
        run: |
          echo "Scanning entire repository with Semgrep comprehensive rules..."
          semgrep scan \
            --exclude=".github" \
            --exclude="*.yml" \
            --exclude="*.yaml" \
            --config="p/default" \
            --config="p/security-audit" \
            --config="p/python" \
            --config="p/cwe-top-25" \
            --config="p/secrets" \
            --config="p/owasp-top-ten" \
            --json -o semgrep-results.json . || true

      - name: Upload Results to Backend
        run: |
          echo "Preparing payload..."
          # Combine PR info and scanner results into one JSON payload
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg pr "${{ github.event.pull_request.number }}" \
            --arg sha "${{ github.event.pull_request.head.sha }}" \
            --slurpfile results semgrep-results.json \
            '{repository: $repo, pr_number: ($pr | tonumber), commit_sha: $sha, results: $results[0]}' > payload.json
          
          # Resolve Backend URL with fallback to Smee URL
          BACKEND_URL="${{ secrets.BACKEND_PUBLIC_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            BACKEND_URL="https://smee.io/ptz0LTwBV48OEP"
          fi
          
          # Remove trailing slash if present
          BACKEND_URL="${BACKEND_URL%/}"
          
          echo "Sending payload directly to $BACKEND_URL..."
          curl -X POST -H "Content-Type: application/json" \
               -d @payload.json \
               "$BACKEND_URL"
